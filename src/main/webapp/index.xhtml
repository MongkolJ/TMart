<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="jakarta.faces.facelets">

<h:head>
    <title>TMart</title>
    <h:outputStylesheet library="css" name="navbar.css"/>
    <h:outputStylesheet library="css" name="index.css"/>
</h:head>

<h:body>
    <ui:include src="/navbar.xhtml"/>

    <h:form>
        <p:dataGrid var="sku" value="#{skuBean.skuList}" columns="3">
            <p:column>
                <div class="sku-card">
                    <img src="#{sku.imageAsBase64}" alt="#{sku.title}"/>
                    <div class="sku-content-container">
                        <h2>#{sku.title}</h2>
                        <p>#{sku.description}</p>
                        <div>
                            <h:outputText value="#{sku.price}" style="font-size: 2rem; font-weight: bold; color: #7c3aed">
                                <f:convertNumber type="currency" currencySymbol="฿"
                                                 groupingUsed="true" minFractionDigits="2"
                                                 maxFractionDigits="2"/>
                            </h:outputText>
                        </div>
                        <p:commandButton value="Add to Cart" icon="pi pi-shopping-cart"
                                         styleClass="btn-add-to-cart"
                                         action="#{cartBean.addItem(sku)}"/>
                    </div>
                </div>
            </p:column>
        </p:dataGrid>
    </h:form>
</h:body>

</html>
