<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="jakarta.faces.facelets">

<h:head>
    <title>TMart Login</title>
    <h:outputStylesheet library="css" name="login.css"/>
</h:head>

<h:body>

    <div class="login-page">
        <div class="login-card">
            <h1>Welcome back</h1>
            <p class="login-subtitle">Enter your credentials to access your account</p>

            <h:form>
                <p:messages showDetail="true" styleClass="login-messages"/>
                <div class="login-field">
                    <label for="username">Username</label>
                    <p:inputText value="#{userBean.username}"
                                 placeholder="Enter your username"
                                 styleClass="login-input"/>
                </div>

                <div class="login-field">
                    <label>Password</label>
                    <p:password value="#{userBean.password}"
                                feedback="false"
                                styleClass="login-input"/>
                </div>

                <p:commandButton value="Login"
                                 action="#{userBean.login()}"
                                 styleClass="login-btn"
                                 ajax="false"/>
                <div class="login-register">
                    Don't have an account? <h:link value="Register here" outcome="register"/>
                </div>
            </h:form>
        </div>
    </div>
</h:body>
</html>
